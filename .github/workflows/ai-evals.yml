name: AI Evaluations

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - agent
          - knowledge

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: spectra-ai-eval-secret-at-least-32-characters
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

jobs:
  agent:
    name: Product Agent Live Evaluation
    if: ${{ inputs.suite == 'agent' || inputs.suite == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Tiptap Pro registry
        uses: ./.github/actions/setup-tiptap-pro-registry
        with:
          token: ${{ secrets.TIPTAP_PRO_TOKEN }}
      - run: npm ci
      - name: Run product Agent evaluation
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: npm run eval:agent:live
      - name: Upload safe Agent report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-live-evaluation
          path: |
            test-results/agent-evals/live-*/report.json
            test-results/agent-evals/live-*/report.md
          if-no-files-found: warn

  knowledge:
    name: Knowledge Live Acceptance
    if: ${{ inputs.suite == 'knowledge' || inputs.suite == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SPECTRA_STRATUMIND_IMAGE: ghcr.io/ln-one/stratumind@sha256:5792dc0ec7836499d6001703c57c2f781378e0aa24c7316000b39ecd0ec93de0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Tiptap Pro registry
        uses: ./.github/actions/setup-tiptap-pro-registry
        with:
          token: ${{ secrets.TIPTAP_PRO_TOKEN }}
      - name: Pull published Stratumind acceptance image
        run: docker pull "$SPECTRA_STRATUMIND_IMAGE"
      - run: npm ci
      - run: npm run knowledge:acceptance:infra:up
      - name: Run live Knowledge acceptance
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: npm run knowledge:acceptance:live
      - name: Upload safe acceptance summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: knowledge-live-acceptance
          path: |
            test-results/knowledge-acceptance/**/summary.json
            test-results/knowledge-acceptance/**/summary.md
          if-no-files-found: warn
      - name: Stop acceptance infrastructure
        if: always()
        run: npm run knowledge:acceptance:infra:down
