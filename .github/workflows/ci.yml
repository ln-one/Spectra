name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://spectra:spectra@localhost:5432/spectra_test
  BETTER_AUTH_SECRET: spectra-ci-secret-at-least-32-characters
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spectra_test
          POSTGRES_PASSWORD: spectra
          POSTGRES_USER: spectra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectra -d spectra_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Tiptap Pro registry
        uses: ./.github/actions/setup-tiptap-pro-registry
        with:
          token: ${{ secrets.TIPTAP_PRO_TOKEN }}
      - run: npm ci
      - name: Migrate application database
        run: npm run db:migrate
      - name: Migrate Better Auth database
        run: npm run auth:migrate
      - name: Initialize DBOS system tables
        run: npm run dbos:setup
      - run: npm run verify

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spectra_test
          POSTGRES_PASSWORD: spectra
          POSTGRES_USER: spectra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectra -d spectra_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.4.0-alpine@sha256:4eec4565e45aa0b3966554c866bc73211e281b0b3d89fe9a33c982e6faca809d
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Tiptap Pro registry
        uses: ./.github/actions/setup-tiptap-pro-registry
        with:
          token: ${{ secrets.TIPTAP_PRO_TOKEN }}
      - run: npm ci
      - name: Start object storage
        run: |
          docker run --detach \
            --name spectra-ci-object-storage \
            --publish 7070:7070 \
            --env ROOT_ACCESS_KEY_ID=spectra-local \
            --env ROOT_SECRET_ACCESS_KEY=spectra-local-only \
            --env VGW_QUIET=true \
            --env VGW_REGION=us-east-1 \
            --volume spectra-ci-object-storage-data:/var/lib/versity/data \
            --volume spectra-ci-object-storage-versions:/var/lib/versity/versions \
            --volume spectra-ci-object-storage-iam:/var/lib/versity/iam \
            versity/versitygw:v1.4.1@sha256:0400cb59f59da0f1cf9f7fd49505191abc348dfadf54509bf1988caaff4eb96f \
            --health /health \
            --iam-dir /var/lib/versity/iam \
            posix \
            --versioning-dir /var/lib/versity/versions \
            /var/lib/versity/data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7070/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs spectra-ci-object-storage
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
      - name: Stop object storage
        if: always()
        run: docker rm --force spectra-ci-object-storage || true

  knowledge-offline:
    name: Knowledge Offline Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPECTRA_STRATUMIND_IMAGE: ghcr.io/ln-one/stratumind@sha256:5792dc0ec7836499d6001703c57c2f781378e0aa24c7316000b39ecd0ec93de0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Tiptap Pro registry
        uses: ./.github/actions/setup-tiptap-pro-registry
        with:
          token: ${{ secrets.TIPTAP_PRO_TOKEN }}
      - name: Pull published Stratumind acceptance image
        run: docker pull "$SPECTRA_STRATUMIND_IMAGE"
      - run: npm ci
      - run: npm run knowledge:acceptance:infra:up
      - run: npm run knowledge:acceptance:offline
      - name: Upload safe acceptance summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: knowledge-offline-acceptance
          path: |
            test-results/knowledge-acceptance/**/summary.json
            test-results/knowledge-acceptance/**/summary.md
          if-no-files-found: warn
      - name: Stop acceptance infrastructure
        if: always()
        run: npm run knowledge:acceptance:infra:down
