name: spectra

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spectra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: spectra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectra -d spectra"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - spectra-postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.4.0-alpine@sha256:4eec4565e45aa0b3966554c866bc73211e281b0b3d89fe9a33c982e6faca809d
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - spectra-redis-data:/data

  object-storage:
    image: versity/versitygw:v1.4.1@sha256:0400cb59f59da0f1cf9f7fd49505191abc348dfadf54509bf1988caaff4eb96f
    command:
      - --health
      - /health
      - --iam-dir
      - /var/lib/versity/iam
      - posix
      - --versioning-dir
      - /var/lib/versity/versions
      - /var/lib/versity/data
    environment:
      ROOT_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      ROOT_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
      VGW_QUIET: "true"
      VGW_REGION: ${STORAGE_REGION:-us-east-1}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - spectra-object-data:/var/lib/versity/data
      - spectra-object-versions:/var/lib/versity/versions
      - spectra-object-iam:/var/lib/versity/iam

  stratumind:
    image: ${SPECTRA_STRATUMIND_IMAGE:-ghcr.io/ln-one/stratumind:api-v1.1.7}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - spectra-stratumind-data:/qdrant/storage

  storage-init:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - npmrc
    command: ["node", "scripts/setup-local-storage.mjs"]
    depends_on:
      object-storage:
        condition: service_healthy
    env_file: .env.production
    environment:
      STORAGE_SETUP_ALLOW_INTERNAL_ENDPOINT: "true"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - npmrc
    command: ["sh", "-c", "npm run db:migrate && npm run auth:migrate && npm run start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      stratumind:
        condition: service_healthy
    env_file: .env.production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      secrets:
        - npmrc
    depends_on:
      app:
        condition: service_healthy
    env_file: .env.production
    environment:
      WORKER_HEALTH_PORT: "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

secrets:
  npmrc:
    file: ./secrets/npmrc

volumes:
  spectra-object-data:
  spectra-object-iam:
  spectra-object-versions:
  spectra-postgres-data:
  spectra-redis-data:
  spectra-stratumind-data:
