name: AI Evaluations

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - agent
          - knowledge

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: spectra-ai-eval-secret-at-least-32-characters
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

jobs:
  agent:
    name: Product Agent Live Evaluation
    if: ${{ inputs.suite == 'agent' || inputs.suite == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run product Agent evaluation
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: npm run eval:agent:live
      - name: Upload safe Agent report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-live-evaluation
          path: |
            test-results/agent-evals/live-*/report.json
            test-results/agent-evals/live-*/report.md
          if-no-files-found: warn

  knowledge:
    name: Knowledge Live Acceptance
    if: ${{ inputs.suite == 'knowledge' || inputs.suite == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ln-one/Stratumind
          ref: c2bd63c8ebb080119d1785b94803e5ad3db1c0a4
          path: .ci/stratumind
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build pinned Stratumind acceptance runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .ci/stratumind
          load: true
          tags: stratumind:api-v1.1.7
          cache-from: type=gha,scope=stratumind-api-v1.1.7
          cache-to: type=gha,mode=max,scope=stratumind-api-v1.1.7,ignore-error=true
      - run: npm ci
      - run: npm run knowledge:acceptance:infra:up
      - name: Run live Knowledge acceptance
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: npm run knowledge:acceptance:live
      - name: Upload safe acceptance summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: knowledge-live-acceptance
          path: |
            test-results/knowledge-acceptance/**/summary.json
            test-results/knowledge-acceptance/**/summary.md
          if-no-files-found: warn
      - name: Stop acceptance infrastructure
        if: always()
        run: npm run knowledge:acceptance:infra:down
