services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spectra_acceptance
      POSTGRES_PASSWORD: spectra
      POSTGRES_USER: spectra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectra -d spectra_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - acceptance-postgres-data:/var/lib/postgresql

  stratumind:
    image: stratumind:api-v1.1.7
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6433:6333"
    security_opt:
      - no-new-privileges:true
    volumes:
      - acceptance-stratumind-data:/qdrant/storage

volumes:
  acceptance-postgres-data:
  acceptance-stratumind-data:
