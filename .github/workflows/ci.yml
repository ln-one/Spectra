name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://spectra:spectra@localhost:5432/spectra_test
  BETTER_AUTH_SECRET: spectra-ci-secret-at-least-32-characters
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spectra_test
          POSTGRES_PASSWORD: spectra
          POSTGRES_USER: spectra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectra -d spectra_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spectra_test
          POSTGRES_PASSWORD: spectra
          POSTGRES_USER: spectra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectra -d spectra_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser

  knowledge-offline:
    name: Knowledge Offline Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ln-one/Stratumind
          ref: c2bd63c8ebb080119d1785b94803e5ad3db1c0a4
          path: .ci/stratumind
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build pinned Stratumind acceptance runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .ci/stratumind
          load: true
          tags: stratumind:api-v1.1.7
          cache-from: type=gha,scope=stratumind-api-v1.1.7
          cache-to: type=gha,mode=max,scope=stratumind-api-v1.1.7,ignore-error=true
      - run: npm ci
      - run: npm run knowledge:acceptance:infra:up
      - run: npm run knowledge:acceptance:offline
      - name: Upload safe acceptance summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: knowledge-offline-acceptance
          path: |
            test-results/knowledge-acceptance/**/summary.json
            test-results/knowledge-acceptance/**/summary.md
          if-no-files-found: warn
      - name: Stop acceptance infrastructure
        if: always()
        run: npm run knowledge:acceptance:infra:down
