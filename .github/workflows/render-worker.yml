name: Artifact Render Runtime

on:
  pull_request:
    paths:
      - Dockerfile.worker
      - Dockerfile.worker.dockerignore
      - .github/workflows/render-worker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.worker
      - Dockerfile.worker.dockerignore
      - .github/workflows/render-worker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: renderer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/ln-one/spectra-render-worker:${{ github.sha }}
      - name: Record immutable deployment reference
        if: github.event_name != 'pull_request'
        run: |
          test -n '${{ steps.renderer.outputs.digest }}'
          echo 'ghcr.io/ln-one/spectra-render-worker@${{ steps.renderer.outputs.digest }}' \
            > render-worker-image.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'pull_request'
        with:
          name: render-worker-image
          path: render-worker-image.txt
          retention-days: 30
